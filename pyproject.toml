[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afrisyl-tokenizer"
version = "0.1.1"
description = "A syllable-aware tokenizer for African languages"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nkosilomusa Ncube", email = "nkosilomusa955@gmail.com"}
]
maintainers = [
    {name = "Nkosilomusa Ncube", email = "nkosilomusa955@gmail.com"}
]
keywords = ["nlp", "tokenizer", "african languages", "shona", "ndebele", "bantu", "syllable", "low-resource"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: English"
]

dependencies = [
    "regex>=2023.0.0",
    "tqdm>=4.65.0",
    "tokenizers>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
    "transformers>=4.30.0"
]

[project.urls]
Homepage = "https://github.com/nkosilomusa-hue/afrisyl-tokenizer"
Repository = "https://github.com/nkosilomusa-hue/afrisyl-tokenizer"
Documentation = "https://github.com/nkosilomusa-hue/afrisyl-tokenizer#readme"
Issues = "https://github.com/nkosilomusa-hue/afrisyl-tokenizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afrisyl_tokenizer = ["vocabs/*.json"]

[tool.black]
line-length = 100
target-version = ['py39']
